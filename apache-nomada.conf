ServerName nomada
ServerTokens Prod
ServerSignature Off

# Los scripts de instalación solo se corren por consola (instalar.sh),
# nunca desde el navegador.
<FilesMatch "^instalar_datos_.*\.php$">
    Require all denied
</FilesMatch>

# No listar carpetas (ej. /img/destinos/)
<Directory /var/www/html>
    Options -Indexes
</Directory>
